services:
  # Backend API
  - type: web
    name: agentpay-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: PORT
        value: 5000
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
